<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HURAIN Admin Panel</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f7f7;
    color: #222;
}

button,
input,
textarea,
select {
    font: inherit;
}

.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #111;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: #fff;
    padding: 35px 25px;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo h1 {
    font-family: Georgia, serif;
    letter-spacing: 4px;
    color: #111;
}

.logo p {
    margin-top: 8px;
    color: #777;
    font-size: 14px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 600;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    outline: none;
    background: #fff;
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: #111;
}

.btn {
    border: 0;
    border-radius: 9px;
    padding: 13px 18px;
    cursor: pointer;
    font-weight: 600;
}

.btn-dark {
    width: 100%;
    background: #111;
    color: #fff;
}

.btn-dark:hover {
    background: #333;
}

.error {
    color: #c62828;
    font-size: 13px;
    margin-top: 12px;
    text-align: center;
    display: none;
}

.admin-app {
    display: none;
    min-height: 100vh;
}

.topbar {
    background: #111;
    color: #fff;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.topbar h2 {
    font-family: Georgia, serif;
    letter-spacing: 2px;
}

.logout-btn {
    background: #fff;
    color: #111;
    border: 0;
    padding: 9px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px 18px 50px;
}

.dashboard-title {
    margin-bottom: 20px;
}

.dashboard-title h1 {
    font-family: Georgia, serif;
    margin-bottom: 7px;
}

.dashboard-title p {
    color: #777;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: #fff;
    padding: 20px;
    border-radius: 13px;
    border: 1px solid #e5e5e5;
}

.stat span {
    display: block;
    color: #777;
    font-size: 13px;
    margin-bottom: 8px;
}

.stat strong {
    font-size: 25px;
}

.panel {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 25px;
}

.panel h2 {
    font-family: Georgia, serif;
    margin-bottom: 18px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.full {
    grid-column: 1 / -1;
}

.image-preview {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid #ddd;
    margin-top: 10px;
    display: none;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.btn-add {
    background: #111;
    color: #fff;
}

.btn-clear {
    background: #eee;
    color: #222;
}

.btn-edit {
    background: #111;
    color: #fff;
    padding: 8px 12px;
}

.btn-delete {
    background: #f2f2f2;
    color: #b00020;
    padding: 8px 12px;
}

.products-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.product-card {
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
}

.product-card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    background: #eee;
}

.product-info {
    padding: 15px;
}

.product-category {
    font-size: 11px;
    text-transform: uppercase;
    color: #888;
    letter-spacing: 1px;
}

.product-name {
    font-family: Georgia, serif;
    font-size: 19px;
    margin: 6px 0;
}

.product-price {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 12px;
}

.product-actions {
    display: flex;
    gap: 7px;
}

.empty {
    text-align: center;
    color: #888;
    padding: 30px 10px;
    border: 1px dashed #ddd;
    border-radius: 10px;
}

.message {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    display: none;
    font-size: 14px;
}

.success {
    background: #e8f5e9;
    color: #2e7d32;
}

@media (max-width: 800px) {
    .products-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .stats,
    .grid,
    .products-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .topbar {
        padding: 13px 15px;
    }

    .topbar h2 {
        font-size: 18px;
    }

    .container {
        padding: 20px 12px 40px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section class="login-screen" id="loginScreen">

    <div class="login-box">

        <div class="logo">
            <h1>HURAIN</h1>
            <p>Premium Jewellery & Cosmetics</p>
        </div>

        <div class="form-group">
            <label>Admin Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
            >
        </div>

        <div class="form-group">
            <label>Admin Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
            >
        </div>

        <button class="btn btn-dark" onclick="login()">
            LOGIN TO ADMIN
        </button>

        <div class="error" id="loginError">
            Invalid username or password.
        </div>

    </div>

</section>


<!-- ADMIN APP -->
<section class="admin-app" id="adminApp">

    <header class="topbar">
        <h2>HURAIN ADMIN</h2>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <main class="container">

        <div class="dashboard-title">
            <h1>Dashboard</h1>
            <p>Manage your HURAIN products.</p>
        </div>


        <!-- STATS -->
        <div class="stats">

            <div class="stat">
                <span>Total Products</span>
                <strong id="totalProducts">0</strong>
            </div>

            <div class="stat">
                <span>Jewellery</span>
                <strong id="jewelleryCount">0</strong>
            </div>

            <div class="stat">
                <span>Cosmetics</span>
                <strong id="cosmeticsCount">0</strong>
            </div>

        </div>


        <!-- ADD PRODUCT -->
        <section class="panel">

            <h2 id="formTitle">Add New Product</h2>

            <div class="message success" id="successMessage">
                Product saved successfully.
            </div>

            <input type="hidden" id="editId">

            <div class="grid">

                <div class="form-group">
                    <label>Product Name</label>
                    <input
                        type="text"
                        id="productName"
                        placeholder="Example: Luxury Jewellery Set"
                    >
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="productCategory">
                        <option value="Jewellery">Jewellery</option>
                        <option value="Cosmetics">Cosmetics</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Gifts">Gifts</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Price (₹)</label>
                    <input
                        type="number"
                        id="productPrice"
                        placeholder="1499"
                        min="0"
                    >
                </div>

                <div class="form-group">
                    <label>Image URL</label>
                    <input
                        type="url"
                        id="productImage"
                        placeholder="https://example.com/product.jpg"
                        oninput="previewImage()"
                    >
                </div>

                <div class="form-group full">
                    <label>Product Description</label>
                    <textarea
                        id="productDescription"
                        placeholder="Write product details here..."
                    ></textarea>

                    <img
                        id="imagePreview"
                        class="image-preview"
                        alt="Product Preview"
                    >
                </div>

            </div>

            <div class="actions">

                <button
                    class="btn btn-add"
                    onclick="saveProduct()"
                >
                    SAVE PRODUCT
                </button>

                <button
                    class="btn btn-clear"
                    onclick="clearForm()"
                >
                    CLEAR
                </button>

            </div>

        </section>


        <!-- PRODUCTS -->
        <section class="panel">

            <h2>Products</h2>

            <div id="productsContainer"></div>

        </section>

    </main>

</section>


<script>

const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "Hurain@123";

const STORAGE_KEY = "hurain_admin_products";


function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("loginError");

    if (
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ) {

        sessionStorage.setItem(
            "hurain_admin_logged_in",
            "true"
        );

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminApp").style.display = "block";

        error.style.display = "none";

        renderProducts();

    } else {

        error.style.display = "block";

    }
}


function logout() {

    sessionStorage.removeItem(
        "hurain_admin_logged_in"
    );

    document.getElementById("adminApp").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";

}


function getProducts() {

    try {

        return JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        ) || [];

    } catch (error) {

        return [];

    }
}


function saveProducts(products) {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(products)
    );

}


function saveProduct() {

    const name =
        document.getElementById("productName").value.trim();

    const category =
        document.getElementById("productCategory").value;

    const price =
        document.getElementById("productPrice").value;

    const image =
        document.getElementById("productImage").value.trim();

    const description =
        document.getElementById("productDescription").value.trim();

    const editId =
        document.getElementById("editId").value;


    if (!name || !price || !image) {

        alert(
            "Please enter Product Name, Price and Image URL."
        );

        return;

    }


    const products = getProducts();


    if (editId) {

        const index =
            products.findIndex(
                product => product.id === Number(editId)
            );

        if (index !== -1) {

            products[index] = {

                ...products[index],

                name: name,
                category: category,
                price: Number(price),
                image: image,
                description: description

            };

        }

    } else {

        products.push({

            id: Date.now(),

            name: name,

            category: category,

            price: Number(price),

            image: image,

            description: description,

            createdAt: new Date().toISOString()

        });

    }


    saveProducts(products);

    showSuccess();

    clearForm();

    renderProducts();

}


function editProduct(id) {

    const products = getProducts();

    const product =
        products.find(
            item => item.id === id
        );

    if (!product) return;


    document.getElementById("editId").value =
        product.id;

    document.getElementById("productName").value =
        product.name;

    document.getElementById("productCategory").value =
        product.category;

    document.getElementById("productPrice").value =
        product.price;

    document.getElementById("productImage").value =
        product.image;

    document.getElementById("productDescription").value =
        product.description || "";

    document.getElementById("formTitle").textContent =
        "Edit Product";

    previewImage();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function deleteProduct(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this product?"
        );

    if (!confirmDelete) return;


    let products = getProducts();

    products =
        products.filter(
            product => product.id !== id
        );

    saveProducts(products);

    renderProducts();

}


function clearForm() {

    document.getElementById("editId").value = "";

    document.getElementById("productName").value = "";

    document.getElementById("productCategory").value =
        "Jewellery";

    document.getElementById("productPrice").value = "";

    document.getElementById("productImage").value = "";

    document.getElementById("productDescription").value = "";

    document.getElementById("formTitle").textContent =
        "Add New Product";

    document.getElementById("imagePreview").style.display =
        "none";

}


function previewImage() {

    const url =
        document.getElementById("productImage").value.trim();

    const preview =
        document.getElementById("imagePreview");


    if (!url) {

        preview.style.display = "none";

        return;

    }


    preview.src = url;

    preview.style.display = "block";

    preview.onerror = function() {

        preview.style.display = "none";

    };

}


function showSuccess() {

    const message =
        document.getElementById("successMessage");

    message.style.display = "block";

    setTimeout(() => {

        message.style.display = "none";

    }, 2500);

}


function renderProducts() {

    const products = getProducts();

    const container =
        document.getElementById("productsContainer");


    document.getElementById("totalProducts").textContent =
        products.length;


    document.getElementById("jewelleryCount").textContent =
        products.filter(
            product => product.category === "Jewellery"
        ).length;


    document.getElementById("cosmeticsCount").textContent =
        products.filter(
            product => product.category === "Cosmetics"
        ).length;


    if (products.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No products added yet.
            </div>
        `;

        return;

    }


    container.innerHTML = `

        <div class="products-grid">

            ${products.map(product => `

                <article class="product-card">

                    <img
                        src="${escapeHtml(product.image)}"
                        alt="${escapeHtml(product.name)}"
                        onerror="this.style.opacity='.3'"
                    >

                    <div class="product-info">

                        <div class="product-category">
                            ${escapeHtml(product.category)}
                        </div>

                        <div class="product-name">
                            ${escapeHtml(product.name)}
                        </div>

                        <div class="product-price">
                            ₹${Number(product.price).toLocaleString("en-IN")}
                        </div>

                        <div class="product-actions">

                            <button
                                class="btn btn-edit"
                                onclick="editProduct(${product.id})"
                            >
                                Edit
                            </button>

                            <button
                                class="btn btn-delete"
                                onclick="deleteProduct(${product.id})"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                </article>

            `).join("")}

        </div>

    `;

}


function escapeHtml(value) {

    return String(value)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* AUTO LOGIN */

if (
    sessionStorage.getItem(
        "hurain_admin_logged_in"
    ) === "true"
) {

    document.getElementById("loginScreen").style.display =
        "none";

    document.getElementById("adminApp").style.display =
        "block";

    renderProducts();

}

</script>

</body>
</html>
